<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply for Job - Job Portal</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">

        <div class="logo">JobPortal</div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/jobs">Jobs</a>
        </div>

    </nav>


    <section class="categories">

        <div class="category">

            <h1>Apply for {{ job.title }}</h1>

            <br>

            <p>
                <strong>Company:</strong>
                {{ job.company }}
            </p>

            <p>
                <strong>Location:</strong>
                {{ job.location }}
            </p>

            <br>

            <form method="POST">

                <label>Full Name</label>
                <br>
                <input type="text" name="applicant_name" required>

                <br><br>

                <label>Email</label>
                <br>
                <input type="email" name="applicant_email" required>

                <br><br>

                <label>Resume</label>
                <br>
                <input type="text" name="resume" placeholder="Resume filename">

                <br><br>

                <button type="submit" class="btn">
                    Submit Application
                </button>

            </form>

        </div>

    </section>

</body>
</html>
