<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ job.title }} - Job Portal</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">

        <div class="logo">JobPortal</div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/jobs">Jobs</a>
            <a href="#">Login</a>
            <a href="#">Register</a>
        </div>

    </nav>


    <section class="categories">

        <div class="category">

            <h1>{{ job.title }}</h1>

            <br>

            <p>
                <strong>Company:</strong>
                {{ job.company }}
            </p>

            <p>
                <strong>Location:</strong>
                {{ job.location }}
            </p>

            <p>
                <strong>Experience:</strong>
                {{ job.experience }}
            </p>

            <br>

            <h3>Job Description</h3>

            <p>{{ job.description }}</p>

            <br>

            <a href="/apply/{{ job.id }}" class="btn">Apply Now</a>

        </div>

    </section>

</body>
</html>
